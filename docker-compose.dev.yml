name: flatpulse-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    env_file:
      - ${FLATPULSE_ENV_FILE:-.env.dev}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["true"]

  bot:
    build: .
    env_file:
      - ${FLATPULSE_ENV_FILE:-.env.dev}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      PARSER_DEBUG_DIR: ${PARSER_DEBUG_DIR:-/app/data/dev-debug_pages}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - debug_pages:/app/data/dev-debug_pages
    command: ["cian-rent-alerts", "--bot-only"]
    healthcheck:
      test: ["CMD", "cian-rent-alerts", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - ${FLATPULSE_ENV_FILE:-.env.dev}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      PARSER_DEBUG_DIR: ${PARSER_DEBUG_DIR:-/app/data/dev-debug_pages}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - debug_pages:/app/data/dev-debug_pages
    command: ["cian-rent-alerts", "--worker-only"]
    healthcheck:
      test: ["CMD", "cian-rent-alerts", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  debug_pages:
