services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["true"]

  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      PARSER_DEBUG_DIR: ${PARSER_DEBUG_DIR:-/app/data/debug_pages}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - debug_pages:/app/data/debug_pages
    command: ["cian-rent-alerts", "--bot-only"]
    healthcheck:
      test: ["CMD", "cian-rent-alerts", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      PARSER_DEBUG_DIR: ${PARSER_DEBUG_DIR:-/app/data/debug_pages}
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - debug_pages:/app/data/debug_pages
    command: ["cian-rent-alerts", "--worker-only"]
    healthcheck:
      test: ["CMD", "cian-rent-alerts", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  webhook:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      RUN_MIGRATIONS: "false"
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: ${WEBHOOK_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["cian-rent-alerts", "--webhook-server"]
    healthcheck:
      test: ["CMD", "cian-rent-alerts", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - .env
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:-:80}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-8080}
    depends_on:
      webhook:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "pg_dump -h postgres -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Fc -f \"/backups/flatpulse_$$(date +%Y%m%d_%H%M%S).dump\"",
      ]

  restore:
    image: postgres:16-alpine
    profiles: ["ops"]
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "test -n \"$${BACKUP_FILE}\" && pg_restore -h postgres -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" --clean --if-exists --no-owner \"/backups/$${BACKUP_FILE}\"",
      ]

volumes:
  postgres_data:
  backups:
  debug_pages:
  caddy_data:
  caddy_config:
